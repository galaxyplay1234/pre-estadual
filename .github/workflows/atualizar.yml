
name: Atualizar dados NDTV

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install node-fetch@2 jsdom

      - name: Rodar scraper de grupos
        timeout-minutes: 2
        run: node sicred/scrape.js

      - name: Rodar scraper de jogos
        timeout-minutes: 4
        run: node sicred/scrape-jogos.js

      - name: Rodar scraper de artilheiros
        timeout-minutes: 2
        run: node sicred/scrape-artilheiros.js

      - name: Commit dos dados atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sicred/*.json
          git commit -m "Atualização dos dados NDTV" || echo "Sem alterações"
          git push
